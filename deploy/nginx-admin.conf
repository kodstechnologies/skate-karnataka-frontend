# Admin SPA — serve React build only (no API proxy on this host).
# API lives on api.karnatakarollerskatingassociation.com

server {
    listen 80;
    server_name admin.karnatakarollerskatingassociation.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.karnatakarollerskatingassociation.com;

    root /home/ubuntu/skate-karnataka-frontend;
    index index.html;

    # SSL paths are injected by install-nginx-admin.sh from the existing certbot config.
    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
